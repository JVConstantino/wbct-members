[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_VERSION = "20"
NPM_VERSION = "10"

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x", "openssl"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "cd .next/standalone && NODE_OPTIONS=--max-http-header-size=262144 node server.js"
